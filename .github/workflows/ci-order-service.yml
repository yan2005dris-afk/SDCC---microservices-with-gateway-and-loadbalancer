name: CI - Order Service

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/order-service/**'
      - 'src/pom.xml'
      - '.github/workflows/ci-order-service.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/order-service/**'
      - 'src/pom.xml'
      - '.github/workflows/ci-order-service.yml'

jobs:
  build-and-test:
    name: Lint, Format & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Format Check (Spotless)
        run: mvn -f src/pom.xml spotless:check -pl order-service

      - name: Lint Analysis (Checkstyle)
        run: mvn -f src/pom.xml checkstyle:check -pl order-service

      # verify = tests unitarios (surefire) + integración con PostgreSQL real vía
      # Testcontainers (failsafe, *IT). Docker está disponible en ubuntu-latest.
      - name: Compile, Unit and Integration Tests
        run: mvn -f src/pom.xml verify -pl order-service
