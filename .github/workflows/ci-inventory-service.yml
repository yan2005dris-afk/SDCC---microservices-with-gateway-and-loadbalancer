name: CI - Inventory Service

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/inventory-service/**'
      - 'src/pom.xml'
      - '.github/workflows/ci-inventory-service.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/inventory-service/**'
      - 'src/pom.xml'
      - '.github/workflows/ci-inventory-service.yml'

jobs:
  build-and-test:
    name: Lint, Format & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Format Check (Spotless)
        run: mvn -f src/pom.xml spotless:check -pl inventory-service

      - name: Lint Analysis (Checkstyle)
        run: mvn -f src/pom.xml checkstyle:check -pl inventory-service

      - name: Compile and Run Tests
        run: mvn -f src/pom.xml test -pl inventory-service
