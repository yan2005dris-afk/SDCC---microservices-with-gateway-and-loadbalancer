server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: api-gateway
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    loadbalancer:
      health-check:
        initial-delay: 1s
        interval: 5s
        path:
          # Readiness: no depende de la BD compartida (ver order-service).
          default: /actuator/health/readiness
      cache:
        enabled: true
        ttl: 5s
    gateway:
      discovery:
        locator:
          enabled: false
      httpclient:
        # Sin esto Netty espera hasta 45 s para conectar con una instancia que ya no existe;
        # con 1 s el reintento llega a otra instancia dentro del timelimiter (3 s).
        connect-timeout: 1000
      routes:
        # Ruta 1: Microservicio de Pedidos con Circuit Breaker y LoadBalancer
        - id: order-service-route
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: orderCircuitBreaker
                fallbackUri: forward:/fallback/orders
            # Red de seguridad para la ventana de descubrimiento: si una instancia se está
            # apagando o acaba de caer, reintenta en otra (el LoadBalancer vuelve a elegir).
            # Solo GET (idempotente) y solo errores de conexión, 502 o 503; nunca 500, para
            # no ocultar errores de la aplicación. Los POST no se reintentan (duplicarían pedidos).
            - name: Retry
              args:
                retries: 2
                methods: GET
                series:
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
                exceptions: java.io.IOException
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 200ms
                  factor: 2
                  basedOnPreviousValue: false

        # Ruta 2: Microservicio de Inventario con Circuit Breaker y LoadBalancer
        - id: inventory-service-route
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
          filters:
            - name: CircuitBreaker
              args:
                name: inventoryCircuitBreaker
                fallbackUri: forward:/fallback/inventory
            - name: Retry
              args:
                retries: 2
                methods: GET
                series:
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
                exceptions: java.io.IOException
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 200ms
                  factor: 2
                  basedOnPreviousValue: false

# Configuración de Resilience4j Circuit Breaker
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-type: count_based
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 3s
    instances:
      orderCircuitBreaker:
        base-config: default
      inventoryCircuitBreaker:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 3s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

sdcc:
  loadbalancer:
    health-check-interval: 5s
    health-check-path: /actuator/health/readiness
    cache-ttl: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always
