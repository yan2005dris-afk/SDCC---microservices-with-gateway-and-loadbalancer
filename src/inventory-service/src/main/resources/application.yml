server:
  port: ${SERVER_PORT:8082}
  # Apagado ordenado: termina las reservas de stock en curso antes de cerrar.
  shutdown: graceful

spring:
  application:
    name: inventory-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:admin_demo_change_me}
    driver-class-name: org.postgresql.Driver
  jackson:
    deserialization:
      accept-float-as-int: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${INSTANCE_ID:${spring.application.name}:${server.port}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      # /actuator/health/readiness decide si la instancia recibe tráfico (Gateway y Docker).
      # No incluye la BD a propósito: primario y réplicas son compartidos por todas las
      # instancias, y si su caída marcara DOWN a todas, una réplica caída cortaría el
      # servicio completo (fallo en cascada). /actuator/health sigue mostrando la BD.
      probes:
        enabled: true
