server:
  port: ${SERVER_PORT:8081}
  # Apagado ordenado: al recibir SIGTERM deja de aceptar peticiones nuevas y
  # termina las que están en curso antes de cerrar.
  shutdown: graceful

spring:
  application:
    name: order-service
  lifecycle:
    # Tiempo máximo para drenar las peticiones en curso.
    timeout-per-shutdown-phase: 20s
  jpa:
    # Cada transacción usa su propia sesión y libera la conexión al terminar. Con la
    # sesión abierta durante toda la petición, los intentos de failover la compartirían.
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${INSTANCE_ID:${spring.application.name}:${server.port}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    db:
      # Lo reemplaza DatabaseNodesHealthIndicator: el indicador db marcaría DOWN la instancia
      # al caer una sola réplica.
      enabled: false
  endpoint:
    health:
      show-details: always
      # /actuator/health/readiness decide si la instancia recibe tráfico (Gateway y Docker).
      # No incluye la BD a propósito: primario y réplicas son compartidos por todas las
      # instancias, y si su caída marcara DOWN a todas, una réplica caída cortaría el
      # servicio completo (fallo en cascada). /actuator/health sigue mostrando la BD.
      probes:
        enabled: true

logging:
  pattern:
    # Contexto de cada línea: correlación (Gateway), instancia y nodo de BD en uso.
    level: "%5p [cid=%X{correlationId:-} inst=%X{instanceId:-} db=%X{dbNode:-}]"

sdcc:
  datasource:
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:admin_demo_change_me}
    # Conexiones máximas por pool de tráfico (primario y cada réplica), por instancia.
    # Total aproximado: instancias x (1 + réplicas) x pool-max-size; debe quedar por debajo
    # de max_connections de PostgreSQL (100 por defecto).
    pool-max-size: ${SDCC_DB_POOL_MAX_SIZE:10}
    primary:
      url: ${DB_PRIMARY_URL:jdbc:postgresql://localhost:5435/orders_db}
    # Réplicas de lectura, en orden de reparto. Para agregar una, añade una entrada.
    replicas:
      - name: REPLICA_1
        url: ${DB_REPLICA1_URL:jdbc:postgresql://localhost:5433/orders_db}
      - name: REPLICA_2
        url: ${DB_REPLICA2_URL:jdbc:postgresql://localhost:5434/orders_db}
    health:
      # Sondeo de todas las réplicas: caída detectada en <= interval + probe-timeout.
      interval: ${SDCC_REPLICA_PROBE_INTERVAL:2s}
      probe-timeout: ${SDCC_REPLICA_PROBE_TIMEOUT:1s}
      # Apta = en recuperación + streaming + lag <= max-lag.
      max-lag: ${SDCC_REPLICA_MAX_LAG:5s}
      # Sondeos UP consecutivos para volver al balanceo (evita que entre y salga).
      rejoin-threshold: ${SDCC_REPLICA_REJOIN_THRESHOLD:2}
    read:
      # Si no queda ninguna réplica sana, las lecturas ordinarias van al primario.
      fallback-to-primary: ${SDCC_READ_FALLBACK_TO_PRIMARY:true}
      # Presupuesto de tiempo: el failover debe quedar por debajo del timelimiter del
      # Gateway (3 s). Peor caso = max(socket-timeout, validación + connection-timeout)
      # + lectura en la otra réplica. socket-timeout cubre una réplica cuya IP
      # desaparece (docker stop): los paquetes se pierden y, sin él, la consulta
      # esperaría indefinidamente.
      replica-connection-timeout: ${SDCC_REPLICA_CONNECTION_TIMEOUT:1s}
      replica-socket-timeout: ${SDCC_REPLICA_SOCKET_TIMEOUT:2s}
      primary-connection-timeout: ${SDCC_PRIMARY_CONNECTION_TIMEOUT:3s}
  shutdown:
    # Al apagarse, la instancia se marca DOWN en Eureka y espera este tiempo antes de
    # drenar, para que el Gateway deje de enviarle peticiones nuevas. Peor caso de
    # propagación ≈ 12 s: caché de Eureka (2 s) + fetch del registro (5 s) + caché del
    # LoadBalancer (5 s); medido ≈ 9,3 s. 15 s deja margen. 0s lo desactiva.
    drain-delay: ${SDCC_SHUTDOWN_DRAIN_DELAY:15s}
