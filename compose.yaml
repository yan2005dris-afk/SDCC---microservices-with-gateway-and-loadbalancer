services:
  # ---------------------------------------------------------------------------
  # BASE DE DATOS: POSTGRESQL PRIMARY (ESCRITURAS / WAL STREAMING)
  # ---------------------------------------------------------------------------
  postgres-primary:
    image: postgres:17
    container_name: postgres-primary
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin_demo_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-laboratorio}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replica_demo_change_me}
    command: [
      "postgres",
      "-c", "wal_level=replica",
      "-c", "max_wal_senders=10",
      "-c", "wal_keep_size=256MB",
      "-c", "hot_standby=on"
    ]
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
      - ./docker/postgres/01-replication.sh:/docker-entrypoint-initdb.d/01-replication.sh:ro
      - ./docker/postgres/02-init-schemas.sql:/docker-entrypoint-initdb.d/02-init-schemas.sql:ro
    # Puerto del HOST configurable (5435 por defecto para no chocar con un PostgreSQL
    # local en 5432). Dentro de la red sdcc-network los servicios siguen usando 5432.
    ports:
      - "${PG_PRIMARY_PORT:-5435}:5432"
    # Comprobación por TCP (-h 127.0.0.1), igual que se conectan réplicas y servicios.
    # Durante el init la imagen levanta un servidor temporal solo por socket local;
    # así el primario no figura "healthy" hasta que el servidor definitivo escucha en red.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-laboratorio}"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - sdcc-network

  # ---------------------------------------------------------------------------
  # BASE DE DATOS: POSTGRESQL RÉPLICA 1 (LECTURAS BALANCEADAS)
  # ---------------------------------------------------------------------------
  postgres-replica1:
    image: postgres:17
    container_name: postgres-replica1
    user: postgres
    # Ante un error de configuración el script sale con exit 1: se reintenta 5 veces y se detiene
    # (evita un bucle infinito de reinicios). "docker stop" manual se respeta (P06/P08).
    restart: on-failure:5
    environment:
      PGDATA: /var/lib/postgresql/data
      PGPASSWORD: ${REPLICATION_PASSWORD:-replica_demo_change_me}
      PRIMARY_HOST: postgres-primary
      # Superusuario heredado del primario vía pg_basebackup; lo usa el healthcheck.
      POSTGRES_USER: ${POSTGRES_USER:-admin}
    entrypoint: ["/bin/bash", "/scripts/start-replica.sh"]
    volumes:
      - pg_replica1_data:/var/lib/postgresql/data
      - ./docker/postgres/start-replica.sh:/scripts/start-replica.sh:ro
    ports:
      - "${PG_REPLICA1_PORT:-5433}:5432"
    # Sana solo si acepta conexiones Y opera como réplica (en recuperación).
    healthcheck:
      test: ["CMD-SHELL", "psql -U \"$${POSTGRES_USER}\" -d postgres -tAc 'SELECT pg_is_in_recovery()' | grep -q t"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - sdcc-network

  # ---------------------------------------------------------------------------
  # BASE DE DATOS: POSTGRESQL RÉPLICA 2 (LECTURAS BALANCEADAS)
  # ---------------------------------------------------------------------------
  postgres-replica2:
    image: postgres:17
    container_name: postgres-replica2
    user: postgres
    restart: on-failure:5
    environment:
      PGDATA: /var/lib/postgresql/data
      PGPASSWORD: ${REPLICATION_PASSWORD:-replica_demo_change_me}
      PRIMARY_HOST: postgres-primary
      # Superusuario heredado del primario vía pg_basebackup; lo usa el healthcheck.
      POSTGRES_USER: ${POSTGRES_USER:-admin}
    entrypoint: ["/bin/bash", "/scripts/start-replica.sh"]
    volumes:
      - pg_replica2_data:/var/lib/postgresql/data
      - ./docker/postgres/start-replica.sh:/scripts/start-replica.sh:ro
    ports:
      - "${PG_REPLICA2_PORT:-5434}:5432"
    # Sana solo si acepta conexiones Y opera como réplica (en recuperación).
    healthcheck:
      test: ["CMD-SHELL", "psql -U \"$${POSTGRES_USER}\" -d postgres -tAc 'SELECT pg_is_in_recovery()' | grep -q t"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - sdcc-network

  # ---------------------------------------------------------------------------
  # DISCOVERY SERVER: NETFLIX EUREKA
  # ---------------------------------------------------------------------------
  eureka-server:
    build:
      context: ./src
      dockerfile: eureka-server/Dockerfile
    container_name: eureka-server
    # Margen para el apagado ordenado (≤20 s) antes de que Docker envíe SIGKILL.
    stop_grace_period: 30s
    ports:
      - "8761:8761"
    environment:
      - SERVER_PORT=8761
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Arranque de la JVM: en frío y con todo el clúster iniciando a la vez se midieron 130 s.
      # Los fallos dentro de este margen no cuentan y el servicio pasa a healthy en cuanto responde.
      start_period: 180s
    restart: unless-stopped
    networks:
      - sdcc-network

  # ---------------------------------------------------------------------------
  # EDGE: SPRING CLOUD GATEWAY + LOADBALANCER
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: ./src
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    # Margen para el apagado ordenado (≤20 s) antes de que Docker envíe SIGKILL.
    stop_grace_period: 30s
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Arranque de la JVM: en frío y con todo el clúster iniciando a la vez se midieron 130 s.
      # Los fallos dentro de este margen no cuentan y el servicio pasa a healthy en cuanto responde.
      start_period: 180s
    # Reinicia si el proceso cae; un "docker stop" manual se respeta (P03).
    restart: unless-stopped
    # El Gateway recibe tráfico solo cuando hay instancias de negocio listas.
    depends_on:
      eureka-server:
        condition: service_healthy
      order-service-1:
        condition: service_healthy
      order-service-2:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    networks:
      - sdcc-network

  # ---------------------------------------------------------------------------
  # MICROSERVICIO: ORDER SERVICE - INSTANCIA 1
  # ---------------------------------------------------------------------------
  order-service-1:
    build:
      context: ./src
      dockerfile: order-service/Dockerfile
    container_name: order-service-1
    # SIGTERM → DOWN en Eureka (15 s) → drenaje (≤20 s) → cierre. Docker espera antes de SIGKILL.
    stop_grace_period: 45s
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - INSTANCE_ID=order-service-1:8081
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - DB_PRIMARY_URL=jdbc:postgresql://postgres-primary:5432/orders_db
      - DB_REPLICA1_URL=jdbc:postgresql://postgres-replica1:5432/orders_db
      - DB_REPLICA2_URL=jdbc:postgresql://postgres-replica2:5432/orders_db
      - DB_USER=${POSTGRES_USER:-admin}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-admin_demo_change_me}
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Arranque de la JVM: en frío y con todo el clúster iniciando a la vez se midieron 130 s.
      # Los fallos dentro de este margen no cuentan y el servicio pasa a healthy en cuanto responde.
      start_period: 180s
    # Reinicia si el proceso cae; un "docker stop" manual se respeta (P03).
    restart: unless-stopped
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica1:
        condition: service_healthy
      postgres-replica2:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - sdcc-network

  # ---------------------------------------------------------------------------
  # MICROSERVICIO: ORDER SERVICE - INSTANCIA 2
  # ---------------------------------------------------------------------------
  order-service-2:
    build:
      context: ./src
      dockerfile: order-service/Dockerfile
    container_name: order-service-2
    # SIGTERM → DOWN en Eureka (15 s) → drenaje (≤20 s) → cierre. Docker espera antes de SIGKILL.
    stop_grace_period: 45s
    ports:
      - "8083:8081"
    environment:
      - SERVER_PORT=8081
      - INSTANCE_ID=order-service-2:8083
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - DB_PRIMARY_URL=jdbc:postgresql://postgres-primary:5432/orders_db
      - DB_REPLICA1_URL=jdbc:postgresql://postgres-replica1:5432/orders_db
      - DB_REPLICA2_URL=jdbc:postgresql://postgres-replica2:5432/orders_db
      - DB_USER=${POSTGRES_USER:-admin}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-admin_demo_change_me}
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Arranque de la JVM: en frío y con todo el clúster iniciando a la vez se midieron 130 s.
      # Los fallos dentro de este margen no cuentan y el servicio pasa a healthy en cuanto responde.
      start_period: 180s
    # Reinicia si el proceso cae; un "docker stop" manual se respeta (P03).
    restart: unless-stopped
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica1:
        condition: service_healthy
      postgres-replica2:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - sdcc-network

  # ---------------------------------------------------------------------------
  # MICROSERVICIO: INVENTORY SERVICE - INSTANCIA ÚNICA
  # ---------------------------------------------------------------------------
  inventory-service:
    build:
      context: ./src
      dockerfile: inventory-service/Dockerfile
    container_name: inventory-service
    # Margen para el apagado ordenado (≤20 s) antes de que Docker envíe SIGKILL.
    stop_grace_period: 30s
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - INSTANCE_ID=inventory-service:8082
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - DB_URL=jdbc:postgresql://postgres-primary:5432/inventory_db
      - DB_USER=${POSTGRES_USER:-admin}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-admin_demo_change_me}
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Arranque de la JVM: en frío y con todo el clúster iniciando a la vez se midieron 130 s.
      # Los fallos dentro de este margen no cuentan y el servicio pasa a healthy en cuanto responde.
      start_period: 180s
    # Reinicia si el proceso cae; un "docker stop" manual se respeta (P03).
    restart: unless-stopped
    depends_on:
      postgres-primary:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - sdcc-network

networks:
  sdcc-network:
    driver: bridge

volumes:
  pg_primary_data:
  pg_replica1_data:
  pg_replica2_data:
